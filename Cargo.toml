[package]
name = "lyra"
version = "0.1.0"
edition = "2024"
description = "Local MiniMax-Music3 song generation with a TUI and web UI (audio.cpp)"
repository = "https://github.com/iamhsouna/lyra"
readme = "README.md"
keywords = ["music", "tui", "gguf", "audio", "minimax"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny_http = "0.12.0"
